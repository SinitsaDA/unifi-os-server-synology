# UniFi OS Server (Ubiquiti) in Docker with automatic updates and "Update" from the UniFi OS console.
# Image: built from the official installer by .github/workflows/build.yml, tag = UniFi OS Server version.
# Settings: .env (copy .env.example). Documentation: README.md
#
# The data lives in Docker volumes (/volume1/@docker/volumes on Synology), not in a shared
# folder: Synology ACLs on shared folders break file permissions of the databases on restore.

services:
  unifi-os-server:
    image: ${UOS_IMAGE:-ghcr.io/sinitsada/unifi-os-server}:${UOS_VERSION:?set UOS_VERSION in .env}
    container_name: unifi-os-server
    hostname: unifi-os-server
    # UniFi OS runs systemd inside; on Synology DSM (cgroup v1) the image applies its patches.
    cgroup: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    extra_hosts:
      host.docker.internal: host-gateway
    tmpfs:
      - /run:exec
      - /run/lock
      - /tmp:exec
      - /var/lib/journal
      - /var/opt/unifi/tmp:size=64m
    environment:
      UOS_SYSTEM_IP: ${UOS_SYSTEM_IP:?set UOS_SYSTEM_IP in .env}
      TZ: ${TZ:-UTC}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - persistent:/persistent
      - var-log:/var/log
      - data:/data
      - srv:/srv
      - var-lib-unifi:/var/lib/unifi
      - var-lib-mongodb:/var/lib/mongodb
      - etc-rabbitmq-ssl:/etc/rabbitmq/ssl
    ports:
      - ${UOS_WEB_PORT:-11443}:443   # UniFi OS web interface (443 is used by DSM)
      - 8080:8080          # device inform
      - 3478:3478/udp      # STUN
      - 10003:10003/udp    # device discovery
      - 6789:6789          # mobile speed test
      - 8444:8444          # hotspot portal (HTTPS)
      - 8880:8880          # hotspot redirect
      - 8881:8881
      - 8882:8882
      - 5514:5514/udp      # remote syslog
      - 5005:5005          # RTP control
      - 9543:9543          # identity hub
      - 5671:5671          # AMQPS
    stop_grace_period: 2m
    restart: unless-stopped

  # Updates UniFi OS Server every day and when "Update" is pressed in the UniFi OS console:
  # backup of all data -> new version -> health check -> automatic rollback on failure.
  updater:
    build: ./updater
    image: unifi-os-updater:local
    container_name: unifi-os-updater
    environment:
      UOS_DIR: ${UOS_DIR}
      UOS_IMAGE: ${UOS_IMAGE:-ghcr.io/sinitsada/unifi-os-server}
      UOS_WEB_PORT: ${UOS_WEB_PORT:-11443}
      # Optional: GitHub token (actions:write) to start the image build of a version that is not built yet.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TZ: ${TZ:-UTC}
      UPDATE_TIME: ${UPDATE_TIME:-04:30}
      MIN_AGE_DAYS: ${MIN_AGE_DAYS:-2}
      KEEP_BACKUPS: ${KEEP_BACKUPS:-5}
      HEALTH_TIMEOUT: ${HEALTH_TIMEOUT:-900}
      AUTO_UPDATE: ${AUTO_UPDATE:-1}
      CONSOLE_UPDATE: ${CONSOLE_UPDATE:-1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mounted at the same path as on the host, so compose resolves the project identically.
      - ${UOS_DIR:?set UOS_DIR in .env}:${UOS_DIR}
      # The data volumes, for backup and restore.
      - persistent:/uos/persistent
      - data:/uos/data
      - srv:/uos/srv
      - var-lib-unifi:/uos/var-lib-unifi
      - var-lib-mongodb:/uos/var-lib-mongodb
      - etc-rabbitmq-ssl:/uos/etc-rabbitmq-ssl
      # Requests made by "Update" in the UniFi OS console (supervisor.js -> console-update.sh).
      - boot:/uos/boot
    restart: unless-stopped

volumes:
  persistent:
  var-log:
  data:
  srv:
  var-lib-unifi:
  var-lib-mongodb:
  etc-rabbitmq-ssl:
  boot:
